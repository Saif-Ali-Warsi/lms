<div class="wrapper mt-30">
  <h2>Add Book</h2>
  <form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
    <div class="form-field">
      <input type="text" formControlName="title" placeholder="Book title" />
    </div>

    <div class="form-field">
      <input type="text" formControlName="author" placeholder="Author" />
    </div>

    <div class="form-field">
      <input type="text" formControlName="category" placeholder="Category" />
    </div>

    <div class="form-field">
      <input
        type="text"
        formControlName="description"
        placeholder="Description"
      />
    </div>

    <div class="form-field">
      <input
        type="number"
        formControlName="publishedYear"
        placeholder="Published Year"
      />
    </div>

    <button type="submit">Add Book</button>
  </form>
</div>
